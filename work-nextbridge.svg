<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="nb-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="nb-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#nb-bg)"/>
  
  <!-- Subtle grid lines -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" stroke="#334155" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M160 0 V500 M320 0 V500 M480 0 V500 M640 0 V500" stroke="#334155" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Browser window frame -->
  <rect x="50" y="45" width="700" height="410" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <!-- Window dots -->
  <circle cx="75" cy="65" r="5" fill="#ef4444"/>
  <circle cx="95" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="65" r="5" fill="#10b981"/>
  <rect x="145" y="56" width="300" height="18" rx="4" fill="#1e293b"/>
  <text x="155" y="69" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">nextbridge-corporate.jp</text>

  <!-- Navbar inside mockup -->
  <rect x="50" y="85" width="700" height="40" fill="#0f172a" opacity="0.9"/>
  <text x="75" y="110" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15">NextBridge</text>
  <circle cx="165" cy="106" r="3" fill="#38bdf8"/>
  <text x="450" y="110" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Services</text>
  <text x="515" y="110" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">About</text>
  <text x="570" y="110" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Careers</text>
  <rect x="630" y="94" width="95" height="24" rx="4" fill="url(#nb-accent)"/>
  <text x="647" y="110" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="10">お問い合わせ</text>

  <!-- Hero Content inside mockup -->
  <rect x="75" y="145" width="130" height="20" rx="10" fill="#1e3a8a"/>
  <text x="87" y="159" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="10">BtoB SaaS SOLUTION</text>

  <text x="75" y="200" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-weight="800" font-size="24">ビジネスの未来を、</text>
  <text x="75" y="235" fill="url(#nb-accent)" font-family="'Noto Sans JP', sans-serif" font-weight="800" font-size="24">一緒に架ける。</text>
  
  <text x="75" y="265" fill="#94a3b8" font-family="'Noto Sans JP', sans-serif" font-size="12">業務効率化とDXを加速させる次世代クラウドプラットフォーム</text>

  <!-- CTA buttons -->
  <rect x="75" y="290" width="130" height="34" rx="6" fill="url(#nb-accent)"/>
  <text x="98" y="312" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-weight="600" font-size="12">資料請求・無料デモ</text>
  <rect x="215" y="290" width="105" height="34" rx="6" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="232" y="312" fill="#cbd5e1" font-family="'Noto Sans JP', sans-serif" font-weight="500" font-size="12">サービス詳細</text>

  <!-- Metrics box on the right -->
  <rect x="420" y="145" width="300" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Metric cards -->
  <rect x="440" y="165" width="120" height="65" rx="6" fill="#0f172a"/>
  <text x="450" y="185" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">導入企業数</text>
  <text x="450" y="215" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="22">320<tspan font-size="14">社+</tspan></text>

  <rect x="580" y="165" width="120" height="65" rx="6" fill="#0f172a"/>
  <text x="590" y="185" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">継続利用率</text>
  <text x="590" y="215" fill="#10b981" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="22">98.5<tspan font-size="14">%</tspan></text>

  <rect x="440" y="245" width="260" height="75" rx="6" fill="#0f172a"/>
  <text x="455" y="270" fill="#cbd5e1" font-family="'Noto Sans JP', sans-serif" font-weight="600" font-size="12">BridgeCRM / BridgeFlow</text>
  <path d="M455 300 C 480 290, 520 310, 560 285 S 620 270, 680 280" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <rect x="440" y="335" width="260" height="50" rx="6" fill="url(#nb-card)"/>
  <text x="455" y="365" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-size="11">★ ★ ★ ★ ★ 顧客満足度 4.8 / 5.0</text>
</svg>