<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sole-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1810" />
      <stop offset="100%" stop-color="#1a0c06" />
    </linearGradient>
    <linearGradient id="sole-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f3e5ab" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#sole-bg)"/>

  <!-- Browser window frame -->
  <rect x="50" y="45" width="700" height="410" rx="10" fill="#1b120c" stroke="#4a2e1b" stroke-width="1"/>
  <!-- Window dots -->
  <circle cx="75" cy="65" r="5" fill="#e74c3c"/>
  <circle cx="95" cy="65" r="5" fill="#f39c12"/>
  <circle cx="115" cy="65" r="5" fill="#27ae60"/>
  <rect x="145" y="56" width="300" height="18" rx="4" fill="#2d1c13"/>
  <text x="155" y="69" fill="#a89078" font-family="'Cinzel', serif" font-size="11">trattoria-sole.jp</text>

  <!-- Restaurant Header -->
  <text x="75" y="112" fill="url(#sole-gold)" font-family="'Cinzel', 'Playfair Display', serif" font-weight="700" font-size="17" letter-spacing="2">Trattoria SOLE</text>
  <text x="440" y="110" fill="#c4ad94" font-family="'Noto Sans JP', sans-serif" font-size="11">料理・コース</text>
  <text x="525" y="110" fill="#c4ad94" font-family="'Noto Sans JP', sans-serif" font-size="11">厳選ワイン</text>
  <text x="600" y="110" fill="#c4ad94" font-family="'Noto Sans JP', sans-serif" font-size="11">こだわり</text>
  <rect x="655" y="94" width="75" height="24" rx="4" fill="#d4af37"/>
  <text x="670" y="110" fill="#1a0c06" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="10">WEB予約</text>

  <line x1="50" y1="128" x2="750" y2="128" stroke="#362215" stroke-width="1"/>

  <!-- Hero Content -->
  <!-- Center aligned luxury restaurant hero -->
  <text x="400" y="180" fill="#d4af37" font-family="'Cinzel', serif" font-size="12" letter-spacing="4" text-anchor="middle">AUTHENTIC ITALIAN RESTAURANT</text>
  <text x="400" y="225" fill="#f5ede3" font-family="'Noto Serif JP', serif" font-weight="700" font-size="24" text-anchor="middle">代々木上原で紡ぐ、</text>
  <text x="400" y="260" fill="#f5ede3" font-family="'Noto Serif JP', serif" font-weight="700" font-size="24" text-anchor="middle">太陽のように温かなイタリアの風土と記憶。</text>
  
  <text x="400" y="295" fill="#a89078" font-family="'Noto Sans JP', sans-serif" font-size="11" text-anchor="middle">本場イタリア仕込みの郷土パスタと、ソムリエ厳選の自然派ワインを特別な空間で。</text>

  <!-- 3 Features / Menu Previews -->
  <rect x="100" y="325" width="180" height="105" rx="6" fill="#2d1c13" stroke="#4a2e1b"/>
  <text x="190" y="360" fill="#d4af37" font-family="'Noto Serif JP', serif" font-size="13" font-weight="600" text-anchor="middle">手打ち生パスタ</text>
  <text x="190" y="385" fill="#a89078" font-family="'Noto Sans JP', sans-serif" font-size="10" text-anchor="middle">毎日店内で仕込む伝統の味</text>

  <rect x="310" y="325" width="180" height="105" rx="6" fill="#2d1c13" stroke="#4a2e1b"/>
  <text x="400" y="360" fill="#d4af37" font-family="'Noto Serif JP', serif" font-size="13" font-weight="600" text-anchor="middle">厳選イタリアワイン</text>
  <text x="400" y="385" fill="#a89078" font-family="'Noto Sans JP', sans-serif" font-size="10" text-anchor="middle">常時120種以上のストック</text>

  <rect x="520" y="325" width="180" height="105" rx="6" fill="#2d1c13" stroke="#4a2e1b"/>
  <text x="610" y="360" fill="#d4af37" font-family="'Noto Serif JP', serif" font-size="13" font-weight="600" text-anchor="middle">記念日・個室ディナー</text>
  <text x="610" y="385" fill="#a89078" font-family="'Noto Sans JP', sans-serif" font-size="10" text-anchor="middle">特別な日のおもてなし空間</text>
</svg>